[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yourllm"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible inference server for AI coding agents."
readme = "README.md"
authors = [
    { name = "Sanjay Sivaramakrishnan", email = "sanjayssk597@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
yourllm-cli = "yourllm.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yourllm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["yourllm"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
